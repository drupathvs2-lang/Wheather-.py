services:
  - type: worker
    name: telegram-weather-alert-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: ADMIN_ID
        value: "8661663559"
